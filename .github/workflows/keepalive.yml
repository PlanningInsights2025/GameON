name: Keep Render Backend Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render Backend
        run: |
          curl --retry 5 --retry-delay 10 --max-time 120 https://gameon-7sox.onrender.com || echo "Server unreachable but workflow continues"