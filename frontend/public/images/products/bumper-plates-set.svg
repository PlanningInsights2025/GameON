<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#374151"/>
      <stop offset="100%" style="stop-color:#4b5563"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000066"/></filter>
  </defs>
  <!-- background -->
  <rect width="300" height="300" fill="url(#bg)"/>
  <rect width="300" height="300" fill="url(#shine)"/>
  <!-- subtle grid -->
  <line x1="0" y1="150" x2="300" y2="150" stroke="#9ca3af" stroke-width="0.4" opacity="0.2"/>
  <line x1="150" y1="0" x2="150" y2="300" stroke="#9ca3af" stroke-width="0.4" opacity="0.2"/>
  
<g transform="translate(30,120)" filter="url(#shadow)">
  <!-- left plates -->
  <rect x="0"  y="-45" width="22" height="90" rx="4" fill="#9ca3af"/>
  <rect x="22" y="-35" width="14" height="70" rx="3" fill="#4b5563"/>
  <!-- bar -->
  <rect x="36" y="-10" width="168" height="20" rx="6" fill="#ffffff"/>
  <!-- right plates -->
  <rect x="204" y="-35" width="14" height="70" rx="3" fill="#4b5563"/>
  <rect x="218" y="-45" width="22" height="90" rx="4" fill="#9ca3af"/>
  <!-- centre knurl -->
  <rect x="100" y="-10" width="40" height="20" rx="4" fill="#9ca3af" opacity="0.4"/>
</g>
<text x="150" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#9ca3af" letter-spacing="0.5">Bumper Plates Set</text>
<text x="150" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ffffff" opacity="0.6">GameON</text>
</svg>