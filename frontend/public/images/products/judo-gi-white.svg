<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7f1d1d"/>
      <stop offset="100%" style="stop-color:#991b1b"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000066"/></filter>
  </defs>
  <!-- background -->
  <rect width="300" height="300" fill="url(#bg)"/>
  <rect width="300" height="300" fill="url(#shine)"/>
  <!-- subtle grid -->
  <line x1="0" y1="150" x2="300" y2="150" stroke="#f87171" stroke-width="0.4" opacity="0.2"/>
  <line x1="150" y1="0" x2="150" y2="300" stroke="#f87171" stroke-width="0.4" opacity="0.2"/>
  
<g transform="translate(60,35)" filter="url(#shadow)">
  <!-- collar v -->
  <polygon points="90,0 60,40 90,55 120,40" fill="#ffffff" opacity="0.9"/>
  <!-- jacket body -->
  <rect x="10" y="30" width="160" height="130" rx="10" fill="#ffffff" opacity="0.85"/>
  <!-- sleeves -->
  <rect x="-30" y="25" width="65" height="60" rx="15" fill="#ffffff" opacity="0.85"/>
  <rect x="145" y="25" width="65" height="60" rx="15" fill="#ffffff" opacity="0.85"/>
  <!-- belt -->
  <rect x="10" y="155" width="160" height="12" rx="4" fill="#f87171"/>
  <text x="90" y="165" text-anchor="middle" font-family="Arial" font-size="9" fill="#7f1d1d">IJF</text>
  <!-- pants -->
  <rect x="30" y="165" width="55" height="60" rx="8" fill="#ffffff" opacity="0.75"/>
  <rect x="95" y="165" width="55" height="60" rx="8" fill="#ffffff" opacity="0.75"/>
</g>
<text x="150" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#f87171" letter-spacing="0.5">Judo Gi White</text>
<text x="150" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ffffff" opacity="0.6">GameON</text>
</svg>