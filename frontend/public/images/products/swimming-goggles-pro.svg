<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0369a1"/>
      <stop offset="100%" style="stop-color:#0ea5e9"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000066"/></filter>
  </defs>
  <!-- background -->
  <rect width="300" height="300" fill="url(#bg)"/>
  <rect width="300" height="300" fill="url(#shine)"/>
  <!-- subtle grid -->
  <line x1="0" y1="150" x2="300" y2="150" stroke="#38bdf8" stroke-width="0.4" opacity="0.2"/>
  <line x1="150" y1="0" x2="150" y2="300" stroke="#38bdf8" stroke-width="0.4" opacity="0.2"/>
  
<g transform="translate(50,85)" filter="url(#shadow)">
  <ellipse cx="75"  cy="70" rx="65" ry="50" fill="#38bdf8"/>
  <ellipse cx="75"  cy="70" rx="52" ry="38" fill="#0369a1" opacity="0.8"/>
  <ellipse cx="75"  cy="70" rx="52" ry="38" fill="#0ea5e9" opacity="0.4"/>
  <ellipse cx="125" cy="70" rx="65" ry="50" fill="#38bdf8"/>
  <ellipse cx="125" cy="70" rx="52" ry="38" fill="#0369a1" opacity="0.8"/>
  <ellipse cx="125" cy="70" rx="52" ry="38" fill="#0ea5e9" opacity="0.4"/>
  <!-- strap -->
  <rect x="0" y="58" width="200" height="24" rx="10" fill="#38bdf8" opacity="0.5"/>
  <!-- nose bridge -->
  <rect x="73" y="60" width="54" height="18" rx="6" fill="#38bdf8"/>
</g>
<text x="150" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" letter-spacing="0.5">Swimming Goggles</text>
<text x="150" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" letter-spacing="0.5">Pro</text>
<text x="150" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ffffff" opacity="0.6">GameON</text>
</svg>