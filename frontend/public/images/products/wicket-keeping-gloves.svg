<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a5c"/>
      <stop offset="100%" style="stop-color:#2d5986"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000066"/></filter>
  </defs>
  <!-- background -->
  <rect width="300" height="300" fill="url(#bg)"/>
  <rect width="300" height="300" fill="url(#shine)"/>
  <!-- subtle grid -->
  <line x1="0" y1="150" x2="300" y2="150" stroke="#e8c84a" stroke-width="0.4" opacity="0.2"/>
  <line x1="150" y1="0" x2="150" y2="300" stroke="#e8c84a" stroke-width="0.4" opacity="0.2"/>
  
<g transform="translate(50,55)" filter="url(#shadow)">
  <!-- left glove -->
  <rect x="5"  y="60" width="85" height="95" rx="15" fill="#e8c84a"/>
  <rect x="5"  y="60" width="85" height="28" rx="10" fill="#ffffff" opacity="0.25"/>
  <rect x="0"  y="105" width="22" height="58" rx="8" fill="#e8c84a" opacity="0.9"/>
  <rect x="73" y="105" width="22" height="52" rx="8" fill="#e8c84a" opacity="0.9"/>
  <rect x="20" y="38"  width="18" height="32" rx="7" fill="#e8c84a"/>
  <rect x="42" y="28"  width="18" height="42" rx="7" fill="#e8c84a"/>
  <rect x="64" y="33"  width="18" height="37" rx="7" fill="#e8c84a"/>
  <!-- right glove -->
  <rect x="110" y="60" width="85" height="95" rx="15" fill="#e8c84a"/>
  <rect x="110" y="60" width="85" height="28" rx="10" fill="#ffffff" opacity="0.25"/>
  <rect x="105" y="105" width="22" height="52" rx="8" fill="#e8c84a" opacity="0.9"/>
  <rect x="178" y="105" width="22" height="58" rx="8" fill="#e8c84a" opacity="0.9"/>
  <rect x="118" y="38" width="18" height="32" rx="7" fill="#e8c84a"/>
  <rect x="140" y="28" width="18" height="42" rx="7" fill="#e8c84a"/>
  <rect x="162" y="33" width="18" height="37" rx="7" fill="#e8c84a"/>
</g>
<text x="150" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#e8c84a" letter-spacing="0.5">Wicket Keeping</text>
<text x="150" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#e8c84a" letter-spacing="0.5">Gloves</text>
<text x="150" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ffffff" opacity="0.6">GameON</text>
</svg>