<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b21a8"/>
      <stop offset="100%" style="stop-color:#9333ea"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000066"/></filter>
  </defs>
  <!-- background -->
  <rect width="300" height="300" fill="url(#bg)"/>
  <rect width="300" height="300" fill="url(#shine)"/>
  <!-- subtle grid -->
  <line x1="0" y1="150" x2="300" y2="150" stroke="#e879f9" stroke-width="0.4" opacity="0.2"/>
  <line x1="150" y1="0" x2="150" y2="300" stroke="#e879f9" stroke-width="0.4" opacity="0.2"/>
  
<g transform="translate(60,25)" filter="url(#shadow)">
  <line x1="60"  y1="0" x2="60"  y2="60" stroke="#ffffff" stroke-width="5"/>
  <line x1="120" y1="0" x2="120" y2="60" stroke="#ffffff" stroke-width="5"/>
  <circle cx="60"  cy="85" r="28" fill="none" stroke="#e879f9" stroke-width="12"/>
  <circle cx="120" cy="85" r="28" fill="none" stroke="#e879f9" stroke-width="12"/>
  <circle cx="60"  cy="85" r="16" fill="none" stroke="#9333ea" stroke-width="4"/>
  <circle cx="120" cy="85" r="16" fill="none" stroke="#9333ea" stroke-width="4"/>
  <!-- athlete -->
  <circle cx="90" cy="175" r="14" fill="#ffffff"/>
  <line x1="90"  y1="189" x2="90"  y2="220" stroke="#ffffff" stroke-width="4"/>
  <line x1="63"  y1="115" x2="90"  y2="200" stroke="#ffffff" stroke-width="4"/>
  <line x1="117" y1="115" x2="90"  y2="200" stroke="#ffffff" stroke-width="4"/>
  <line x1="80"  y1="220" x2="70"  y2="245" stroke="#ffffff" stroke-width="4"/>
  <line x1="100" y1="220" x2="110" y2="245" stroke="#ffffff" stroke-width="4"/>
</g>
<text x="150" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#e879f9" letter-spacing="0.5">Gymnastic Rings</text>
<text x="150" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#e879f9" letter-spacing="0.5">Set</text>
<text x="150" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ffffff" opacity="0.6">GameON</text>
</svg>