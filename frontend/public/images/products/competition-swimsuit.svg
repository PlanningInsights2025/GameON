<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0369a1"/>
      <stop offset="100%" style="stop-color:#0ea5e9"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000066"/></filter>
  </defs>
  <!-- background -->
  <rect width="300" height="300" fill="url(#bg)"/>
  <rect width="300" height="300" fill="url(#shine)"/>
  <!-- subtle grid -->
  <line x1="0" y1="150" x2="300" y2="150" stroke="#38bdf8" stroke-width="0.4" opacity="0.2"/>
  <line x1="150" y1="0" x2="150" y2="300" stroke="#38bdf8" stroke-width="0.4" opacity="0.2"/>
  
<g transform="translate(70,30)" filter="url(#shadow)">
  <!-- torso -->
  <rect x="40" y="40" width="80" height="130" rx="15" fill="#38bdf8"/>
  <!-- shoulder straps -->
  <rect x="48" y="10" width="18" height="50" rx="6" fill="#38bdf8"/>
  <rect x="94" y="10" width="18" height="50" rx="6" fill="#38bdf8"/>
  <!-- front panel -->
  <rect x="48" y="55" width="64" height="100" rx="8" fill="#0ea5e9" opacity="0.5"/>
  <!-- logo area -->
  <text x="80" y="115" text-anchor="middle" font-family="Arial" font-size="11" fill="#ffffff" font-weight="bold">FINA</text>
</g>
<text x="150" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" letter-spacing="0.5">Competition</text>
<text x="150" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" letter-spacing="0.5">Swimsuit</text>
<text x="150" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ffffff" opacity="0.6">GameON</text>
</svg>