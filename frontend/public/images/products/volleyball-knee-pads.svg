<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#155e75"/>
      <stop offset="100%" style="stop-color:#0e7490"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000066"/></filter>
  </defs>
  <!-- background -->
  <rect width="300" height="300" fill="url(#bg)"/>
  <rect width="300" height="300" fill="url(#shine)"/>
  <!-- subtle grid -->
  <line x1="0" y1="150" x2="300" y2="150" stroke="#67e8f9" stroke-width="0.4" opacity="0.2"/>
  <line x1="150" y1="0" x2="150" y2="300" stroke="#67e8f9" stroke-width="0.4" opacity="0.2"/>
  
<g transform="translate(65,45)" filter="url(#shadow)">
  <!-- left -->
  <rect x="0"   y="20" width="68" height="200" rx="20" fill="#67e8f9"/>
  <ellipse cx="34" cy="110" rx="28" ry="30" fill="#0e7490" opacity="0.5"/>
  <!-- right -->
  <rect x="102" y="20" width="68" height="200" rx="20" fill="#67e8f9"/>
  <ellipse cx="136" cy="110" rx="28" ry="30" fill="#0e7490" opacity="0.5"/>
</g>
<text x="150" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#67e8f9" letter-spacing="0.5">Volleyball Knee</text>
<text x="150" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#67e8f9" letter-spacing="0.5">Pads</text>
<text x="150" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ffffff" opacity="0.6">GameON</text>
</svg>