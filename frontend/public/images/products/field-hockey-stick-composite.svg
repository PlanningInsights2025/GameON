<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c4a6e"/>
      <stop offset="100%" style="stop-color:#075985"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000066"/></filter>
  </defs>
  <!-- background -->
  <rect width="300" height="300" fill="url(#bg)"/>
  <rect width="300" height="300" fill="url(#shine)"/>
  <!-- subtle grid -->
  <line x1="0" y1="150" x2="300" y2="150" stroke="#7dd3fc" stroke-width="0.4" opacity="0.2"/>
  <line x1="150" y1="0" x2="150" y2="300" stroke="#7dd3fc" stroke-width="0.4" opacity="0.2"/>
  
<g transform="translate(80,25)" filter="url(#shadow)">
  <rect x="60" y="0" width="18" height="180" rx="6" fill="#7dd3fc"/>
  <path d="M60,175 Q30,195 10,220 L35,225 Q65,200 78,180" fill="#7dd3fc"/>
  <!-- grip tape bands -->
  <rect x="58" y="20"  width="22" height="8"  rx="2" fill="#ffffff" opacity="0.3"/>
  <rect x="58" y="35"  width="22" height="8"  rx="2" fill="#ffffff" opacity="0.3"/>
  <rect x="58" y="50"  width="22" height="8"  rx="2" fill="#ffffff" opacity="0.3"/>
  <!-- ball -->
  <circle cx="130" cy="215" r="22" fill="white"/>
  <circle cx="130" cy="215" r="22" fill="none" stroke="#ccc" stroke-width="1.5"/>
</g>
<text x="150" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#7dd3fc" letter-spacing="0.5">Field Hockey Stick</text>
<text x="150" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#7dd3fc" letter-spacing="0.5">Composite</text>
<text x="150" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ffffff" opacity="0.6">GameON</text>
</svg>