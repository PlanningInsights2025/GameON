<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#064e3b"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000066"/></filter>
  </defs>
  <!-- background -->
  <rect width="300" height="300" fill="url(#bg)"/>
  <rect width="300" height="300" fill="url(#shine)"/>
  <!-- subtle grid -->
  <line x1="0" y1="150" x2="300" y2="150" stroke="#6ee7b7" stroke-width="0.4" opacity="0.2"/>
  <line x1="150" y1="0" x2="150" y2="300" stroke="#6ee7b7" stroke-width="0.4" opacity="0.2"/>
  
<g transform="translate(80,40)" filter="url(#shadow)">
  <ellipse cx="70" cy="75" rx="60" ry="72" fill="none" stroke="#6ee7b7" stroke-width="8"/>
  <!-- strings horizontal -->
  <line x1="12" y1="40"  x2="128" y2="40"  stroke="#6ee7b7" stroke-width="1.5" opacity="0.7"/>
  <line x1="12" y1="55"  x2="128" y2="55"  stroke="#6ee7b7" stroke-width="1.5" opacity="0.7"/>
  <line x1="12" y1="70"  x2="128" y2="70"  stroke="#6ee7b7" stroke-width="1.5" opacity="0.7"/>
  <line x1="12" y1="85"  x2="128" y2="85"  stroke="#6ee7b7" stroke-width="1.5" opacity="0.7"/>
  <line x1="12" y1="100" x2="128" y2="100" stroke="#6ee7b7" stroke-width="1.5" opacity="0.7"/>
  <line x1="12" y1="115" x2="128" y2="115" stroke="#6ee7b7" stroke-width="1.5" opacity="0.7"/>
  <!-- strings vertical -->
  <line x1="30"  y1="10" x2="30"  y2="145" stroke="#6ee7b7" stroke-width="1.5" opacity="0.7"/>
  <line x1="50"  y1="5"  x2="50"  y2="148" stroke="#6ee7b7" stroke-width="1.5" opacity="0.7"/>
  <line x1="70"  y1="3"  x2="70"  y2="148" stroke="#6ee7b7" stroke-width="1.5" opacity="0.7"/>
  <line x1="90"  y1="5"  x2="90"  y2="148" stroke="#6ee7b7" stroke-width="1.5" opacity="0.7"/>
  <line x1="110" y1="10" x2="110" y2="145" stroke="#6ee7b7" stroke-width="1.5" opacity="0.7"/>
  <!-- handle -->
  <rect x="60" y="144" width="20" height="80" rx="5" fill="#6ee7b7"/>
  <rect x="57" y="144" width="26" height="10" rx="3" fill="#ffffff" opacity="0.4"/>
</g>
<text x="150" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#6ee7b7" letter-spacing="0.5">Carbon Badminton</text>
<text x="150" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#6ee7b7" letter-spacing="0.5">Racket</text>
<text x="150" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ffffff" opacity="0.6">GameON</text>
</svg>