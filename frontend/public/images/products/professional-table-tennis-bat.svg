<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4c1d95"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000066"/></filter>
  </defs>
  <!-- background -->
  <rect width="300" height="300" fill="url(#bg)"/>
  <rect width="300" height="300" fill="url(#shine)"/>
  <!-- subtle grid -->
  <line x1="0" y1="150" x2="300" y2="150" stroke="#c4b5fd" stroke-width="0.4" opacity="0.2"/>
  <line x1="150" y1="0" x2="150" y2="300" stroke="#c4b5fd" stroke-width="0.4" opacity="0.2"/>
  
<g transform="translate(70,45)" filter="url(#shadow)">
  <ellipse cx="90" cy="90" rx="80" ry="85" fill="#c4b5fd"/>
  <ellipse cx="90" cy="90" rx="68" ry="73" fill="#cc2222"/>
  <!-- handle -->
  <rect x="75" y="173" width="30" height="65" rx="8" fill="#c4b5fd"/>
  <ellipse cx="90" cy="90" rx="15" ry="15" fill="#c4b5fd" opacity="0.4"/>
  <!-- brand text -->
  <text x="90" y="96" text-anchor="middle" font-family="Arial" font-size="11" fill="#ffffff" font-weight="bold" opacity="0.7">PRO</text>
</g>
<text x="150" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#c4b5fd" letter-spacing="0.5">Professional Table</text>
<text x="150" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#c4b5fd" letter-spacing="0.5">Tennis Bat</text>
<text x="150" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ffffff" opacity="0.6">GameON</text>
</svg>