<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#155e75"/>
      <stop offset="100%" style="stop-color:#0e7490"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000066"/></filter>
  </defs>
  <!-- background -->
  <rect width="300" height="300" fill="url(#bg)"/>
  <rect width="300" height="300" fill="url(#shine)"/>
  <!-- subtle grid -->
  <line x1="0" y1="150" x2="300" y2="150" stroke="#67e8f9" stroke-width="0.4" opacity="0.2"/>
  <line x1="150" y1="0" x2="150" y2="300" stroke="#67e8f9" stroke-width="0.4" opacity="0.2"/>
  
<g transform="translate(150,145)" filter="url(#shadow)">
  <circle cx="0" cy="0" r="60" fill="#f0f0f0"/>
  <path d="M-60,0 C-40,-50 40,-50 60,0"   fill="none" stroke="#67e8f9" stroke-width="5"/>
  <path d="M-60,0 C-40,50 40,50 60,0"    fill="none" stroke="#67e8f9" stroke-width="5"/>
  <path d="M0,-60 C30,-30 30,30 0,60"    fill="none" stroke="#1e3a8a" stroke-width="5"/>
  <path d="M0,-60 C-30,-30 -30,30 0,60"  fill="none" stroke="#1e3a8a" stroke-width="5"/>
  <line x1="-60" y1="0" x2="60" y2="0"  stroke="#6b7280" stroke-width="2" opacity="0.4"/>
</g>
<text x="150" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#67e8f9" letter-spacing="0.5">Indoor Volleyball</text>
<text x="150" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ffffff" opacity="0.6">GameON</text>
</svg>