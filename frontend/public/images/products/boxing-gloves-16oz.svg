<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7f1d1d"/>
      <stop offset="100%" style="stop-color:#991b1b"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000066"/></filter>
  </defs>
  <!-- background -->
  <rect width="300" height="300" fill="url(#bg)"/>
  <rect width="300" height="300" fill="url(#shine)"/>
  <!-- subtle grid -->
  <line x1="0" y1="150" x2="300" y2="150" stroke="#f87171" stroke-width="0.4" opacity="0.2"/>
  <line x1="150" y1="0" x2="150" y2="300" stroke="#f87171" stroke-width="0.4" opacity="0.2"/>
  
<g transform="translate(55,50)" filter="url(#shadow)">
  <!-- left glove -->
  <rect x="0"   y="50" width="75" height="100" rx="25" fill="#f87171"/>
  <ellipse cx="37" cy="50" rx="37" ry="40" fill="#f87171"/>
  <rect x="10" y="148" width="55" height="20" rx="6" fill="#ffffff" opacity="0.3"/>
  <!-- right glove -->
  <rect x="115" y="50" width="75" height="100" rx="25" fill="#f87171"/>
  <ellipse cx="152" cy="50" rx="37" ry="40" fill="#f87171"/>
  <rect x="125" y="148" width="55" height="20" rx="6" fill="#ffffff" opacity="0.3"/>
  <!-- lace lines -->
  <line x1="20" y1="120" x2="66" y2="120" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
  <line x1="20" y1="130" x2="66" y2="130" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
  <line x1="134" y1="120" x2="180" y2="120" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
  <line x1="134" y1="130" x2="180" y2="130" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
</g>
<text x="150" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#f87171" letter-spacing="0.5">Boxing Gloves 16oz</text>
<text x="150" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ffffff" opacity="0.6">GameON</text>
</svg>