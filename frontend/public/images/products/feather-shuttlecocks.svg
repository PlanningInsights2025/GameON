<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#064e3b"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000066"/></filter>
  </defs>
  <!-- background -->
  <rect width="300" height="300" fill="url(#bg)"/>
  <rect width="300" height="300" fill="url(#shine)"/>
  <!-- subtle grid -->
  <line x1="0" y1="150" x2="300" y2="150" stroke="#6ee7b7" stroke-width="0.4" opacity="0.2"/>
  <line x1="150" y1="0" x2="150" y2="300" stroke="#6ee7b7" stroke-width="0.4" opacity="0.2"/>
  
<g transform="translate(110,45)" filter="url(#shadow)">
  <!-- base cork -->
  <ellipse cx="40" cy="190" rx="22" ry="18" fill="#e8c84a"/>
  <!-- feather spread -->
  <g opacity="0.9">
    <line x1="40" y1="175" x2="0"  y2="30" stroke="#ffffff" stroke-width="2"/>
    <line x1="40" y1="175" x2="15" y2="15" stroke="#ffffff" stroke-width="2"/>
    <line x1="40" y1="175" x2="30" y2="10" stroke="#ffffff" stroke-width="2"/>
    <line x1="40" y1="175" x2="40" y2="8"  stroke="#ffffff" stroke-width="2.5"/>
    <line x1="40" y1="175" x2="55" y2="10" stroke="#ffffff" stroke-width="2"/>
    <line x1="40" y1="175" x2="68" y2="15" stroke="#ffffff" stroke-width="2"/>
    <line x1="40" y1="175" x2="80" y2="30" stroke="#ffffff" stroke-width="2"/>
  </g>
  <!-- circular connectors -->
  <ellipse cx="40" cy="95"  rx="28" ry="5" fill="none" stroke="#6ee7b7" stroke-width="2" opacity="0.7"/>
  <ellipse cx="40" cy="135" rx="22" ry="4" fill="none" stroke="#6ee7b7" stroke-width="2" opacity="0.7"/>
  <ellipse cx="40" cy="60"  rx="34" ry="5" fill="none" stroke="#6ee7b7" stroke-width="2" opacity="0.5"/>
</g>
<text x="150" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#6ee7b7" letter-spacing="0.5">Feather</text>
<text x="150" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#6ee7b7" letter-spacing="0.5">Shuttlecocks</text>
<text x="150" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ffffff" opacity="0.6">GameON</text>
</svg>