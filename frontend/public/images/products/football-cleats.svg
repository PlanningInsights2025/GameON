<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#166534"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000066"/></filter>
  </defs>
  <!-- background -->
  <rect width="300" height="300" fill="url(#bg)"/>
  <rect width="300" height="300" fill="url(#shine)"/>
  <!-- subtle grid -->
  <line x1="0" y1="150" x2="300" y2="150" stroke="#4ade80" stroke-width="0.4" opacity="0.2"/>
  <line x1="150" y1="0" x2="150" y2="300" stroke="#4ade80" stroke-width="0.4" opacity="0.2"/>
  
<g transform="translate(50,60)" filter="url(#shadow)">
  <!-- shoe body -->
  <path d="M10,130 Q20,80 80,70 Q140,60 180,80 L190,130 Z" fill="#4ade80"/>
  <path d="M10,130 Q40,145 100,145 Q160,145 190,130 L190,130 Z" fill="#16a34a"/>
  <!-- sole -->
  <rect x="10" y="128" width="180" height="12" rx="4" fill="#ffffff" opacity="0.5"/>
  <!-- spikes -->
  <line x1="35"  y1="140" x2="35"  y2="165" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="65"  y1="140" x2="65"  y2="165" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="95"  y1="140" x2="95"  y2="165" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="125" y1="140" x2="125" y2="165" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="155" y1="140" x2="155" y2="168" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <!-- laces -->
  <line x1="50"  y1="90"  x2="160" y2="90"  stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  <line x1="55"  y1="100" x2="155" y2="100" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  <line x1="60"  y1="110" x2="150" y2="110" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
</g>
<text x="150" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#4ade80" letter-spacing="0.5">Football Cleats</text>
<text x="150" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ffffff" opacity="0.6">GameON</text>
</svg>