<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c2410c"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000066"/></filter>
  </defs>
  <!-- background -->
  <rect width="300" height="300" fill="url(#bg)"/>
  <rect width="300" height="300" fill="url(#shine)"/>
  <!-- subtle grid -->
  <line x1="0" y1="150" x2="300" y2="150" stroke="#fb923c" stroke-width="0.4" opacity="0.2"/>
  <line x1="150" y1="0" x2="150" y2="300" stroke="#fb923c" stroke-width="0.4" opacity="0.2"/>
  
<g transform="translate(20,55)" filter="url(#shadow)">
  <!-- pit -->
  <rect x="0" y="60" width="260" height="160" rx="10" fill="#fb923c"/>
  <rect x="8" y="68" width="244" height="144" rx="6" fill="#ea580c"/>
  <!-- foam blocks -->
  <rect x="15" y="75" width="50" height="50" rx="4" fill="#fb923c" opacity="0.5"/>
  <rect x="70" y="75" width="50" height="50" rx="4" fill="#fb923c" opacity="0.6"/>
  <rect x="125" y="75" width="50" height="50" rx="4" fill="#fb923c" opacity="0.5"/>
  <rect x="180" y="75" width="60" height="50" rx="4" fill="#fb923c" opacity="0.6"/>
  <rect x="15" y="130" width="70" height="50" rx="4" fill="#fb923c" opacity="0.6"/>
  <rect x="90" y="130" width="70" height="50" rx="4" fill="#fb923c" opacity="0.5"/>
  <rect x="165" y="130" width="75" height="50" rx="4" fill="#fb923c" opacity="0.6"/>
  <!-- bar -->
  <rect x="0" y="50" width="260" height="12" rx="4" fill="#ffffff" opacity="0.8"/>
  <rect x="0" y="40" width="10" height="30" rx="3" fill="#ffffff" opacity="0.6"/>
  <rect x="250" y="40" width="10" height="30" rx="3" fill="#ffffff" opacity="0.6"/>
</g>
<text x="150" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#fb923c" letter-spacing="0.5">High Jump Landing</text>
<text x="150" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#fb923c" letter-spacing="0.5">Mat</text>
<text x="150" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ffffff" opacity="0.6">GameON</text>
</svg>