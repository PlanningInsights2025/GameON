<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000066"/></filter>
  </defs>
  <!-- background -->
  <rect width="300" height="300" fill="url(#bg)"/>
  <rect width="300" height="300" fill="url(#shine)"/>
  <!-- subtle grid -->
  <line x1="0" y1="150" x2="300" y2="150" stroke="#60a5fa" stroke-width="0.4" opacity="0.2"/>
  <line x1="150" y1="0" x2="150" y2="300" stroke="#60a5fa" stroke-width="0.4" opacity="0.2"/>
  
<g transform="translate(60,30)" filter="url(#shadow)">
  <ellipse cx="90" cy="90" rx="88" ry="70" fill="#60a5fa"/>
  <!-- vents -->
  <rect x="25" y="50"  width="18" height="45" rx="7" fill="#1e3a8a" opacity="0.6"/>
  <rect x="51" y="40"  width="18" height="55" rx="7" fill="#1e3a8a" opacity="0.6"/>
  <rect x="77" y="35"  width="18" height="60" rx="7" fill="#1e3a8a" opacity="0.6"/>
  <rect x="103" y="35" width="18" height="60" rx="7" fill="#1e3a8a" opacity="0.6"/>
  <rect x="129" y="40" width="18" height="55" rx="7" fill="#1e3a8a" opacity="0.6"/>
  <rect x="155" y="50" width="18" height="45" rx="7" fill="#1e3a8a" opacity="0.6"/>
  <!-- brim -->
  <rect x="2" y="130" width="176" height="22" rx="6" fill="#2563eb"/>
  <!-- straps -->
  <line x1="30"  y1="152" x2="10"  y2="185" stroke="#60a5fa" stroke-width="4"/>
  <line x1="150" y1="152" x2="170" y2="185" stroke="#60a5fa" stroke-width="4"/>
  <rect x="78" y="175" width="24" height="12" rx="4" fill="#60a5fa"/>
</g>
<text x="150" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#60a5fa" letter-spacing="0.5">Cycling Helmet</text>
<text x="150" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#60a5fa" letter-spacing="0.5">Aero</text>
<text x="150" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ffffff" opacity="0.6">GameON</text>
</svg>