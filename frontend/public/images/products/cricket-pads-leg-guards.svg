<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a5c"/>
      <stop offset="100%" style="stop-color:#2d5986"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000066"/></filter>
  </defs>
  <!-- background -->
  <rect width="300" height="300" fill="url(#bg)"/>
  <rect width="300" height="300" fill="url(#shine)"/>
  <!-- subtle grid -->
  <line x1="0" y1="150" x2="300" y2="150" stroke="#e8c84a" stroke-width="0.4" opacity="0.2"/>
  <line x1="150" y1="0" x2="150" y2="300" stroke="#e8c84a" stroke-width="0.4" opacity="0.2"/>
  
<g transform="translate(80,50)" filter="url(#shadow)">
  <rect x="10" y="10" width="55" height="165" rx="20" fill="#e8c84a"/>
  <rect x="15" y="10" width="45" height="165" rx="18" fill="#2d5986"/>
  <rect x="85" y="10" width="55" height="165" rx="20" fill="#e8c84a"/>
  <rect x="90" y="10" width="45" height="165" rx="18" fill="#2d5986"/>
  <!-- straps -->
  <rect x="5" y="50" width="65" height="8" rx="3" fill="#e8c84a"/>
  <rect x="5" y="90" width="65" height="8" rx="3" fill="#e8c84a"/>
  <rect x="5" y="130" width="65" height="8" rx="3" fill="#e8c84a"/>
  <rect x="80" y="50" width="65" height="8" rx="3" fill="#e8c84a"/>
  <rect x="80" y="90" width="65" height="8" rx="3" fill="#e8c84a"/>
  <rect x="80" y="130" width="65" height="8" rx="3" fill="#e8c84a"/>
</g>
<text x="150" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#e8c84a" letter-spacing="0.5">Cricket Pads Leg</text>
<text x="150" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#e8c84a" letter-spacing="0.5">Guards</text>
<text x="150" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ffffff" opacity="0.6">GameON</text>
</svg>