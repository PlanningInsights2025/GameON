<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a5c"/>
      <stop offset="100%" style="stop-color:#2d5986"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000066"/></filter>
  </defs>
  <!-- background -->
  <rect width="300" height="300" fill="url(#bg)"/>
  <rect width="300" height="300" fill="url(#shine)"/>
  <!-- subtle grid -->
  <line x1="0" y1="150" x2="300" y2="150" stroke="#e8c84a" stroke-width="0.4" opacity="0.2"/>
  <line x1="150" y1="0" x2="150" y2="300" stroke="#e8c84a" stroke-width="0.4" opacity="0.2"/>
  
<g transform="translate(60,70)" filter="url(#shadow)">
  <rect x="0" y="30" width="180" height="110" rx="20" fill="#e8c84a"/>
  <rect x="0" y="30" width="180" height="30" rx="15" fill="#2d5986"/>
  <!-- handle -->
  <path d="M60,30 Q90,0 120,30" fill="none" stroke="#e8c84a" stroke-width="10" stroke-linecap="round"/>
  <!-- zip -->
  <line x1="15" y1="58" x2="165" y2="58" stroke="#ffffff" stroke-width="2" opacity="0.5" stroke-dasharray="5,3"/>
  <!-- logo circle -->
  <circle cx="90" cy="100" r="28" fill="#2d5986" opacity="0.6"/>
  <text x="90" y="106" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">GO</text>
  <!-- pockets -->
  <rect x="10" y="75" width="30" height="55" rx="8" fill="#2d5986" opacity="0.5"/>
  <rect x="140" y="75" width="30" height="55" rx="8" fill="#2d5986" opacity="0.5"/>
</g>
<text x="150" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#e8c84a" letter-spacing="0.5">Cricket Kit Bag</text>
<text x="150" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ffffff" opacity="0.6">GameON</text>
</svg>