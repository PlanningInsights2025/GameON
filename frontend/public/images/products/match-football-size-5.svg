<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#166534"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000066"/></filter>
  </defs>
  <!-- background -->
  <rect width="300" height="300" fill="url(#bg)"/>
  <rect width="300" height="300" fill="url(#shine)"/>
  <!-- subtle grid -->
  <line x1="0" y1="150" x2="300" y2="150" stroke="#4ade80" stroke-width="0.4" opacity="0.2"/>
  <line x1="150" y1="0" x2="150" y2="300" stroke="#4ade80" stroke-width="0.4" opacity="0.2"/>
  
<g transform="translate(150,145)" filter="url(#shadow)">
  <circle cx="0" cy="0" r="62" fill="#f0f0f0"/>
  <polygon points="0,-40 22,-15 14,18 -14,18 -22,-15" fill="#1a1a1a"/>
  <polygon points="0,-62 24,-50 38,-22 24,6 0,14 -24,6 -38,-22 -24,-50" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="30,40 55,25 60,0 38,-22 24,6"  fill="#1a1a1a" opacity="0.5"/>
  <polygon points="-30,40 -55,25 -60,0 -38,-22 -24,6" fill="#1a1a1a" opacity="0.5"/>
</g>
<text x="150" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#4ade80" letter-spacing="0.5">Match Football</text>
<text x="150" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#4ade80" letter-spacing="0.5">Size 5</text>
<text x="150" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ffffff" opacity="0.6">GameON</text>
</svg>