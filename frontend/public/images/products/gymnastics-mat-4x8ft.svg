<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b21a8"/>
      <stop offset="100%" style="stop-color:#9333ea"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000066"/></filter>
  </defs>
  <!-- background -->
  <rect width="300" height="300" fill="url(#bg)"/>
  <rect width="300" height="300" fill="url(#shine)"/>
  <!-- subtle grid -->
  <line x1="0" y1="150" x2="300" y2="150" stroke="#e879f9" stroke-width="0.4" opacity="0.2"/>
  <line x1="150" y1="0" x2="150" y2="300" stroke="#e879f9" stroke-width="0.4" opacity="0.2"/>
  
<g transform="translate(20,80)" filter="url(#shadow)">
  <rect x="0" y="0" width="260" height="130" rx="12" fill="#e879f9"/>
  <rect x="6" y="6" width="248" height="118" rx="8" fill="#9333ea"/>
  <!-- texture lines -->
  <line x1="6"   y1="38" x2="254" y2="38" stroke="#e879f9" stroke-width="1.5" opacity="0.4"/>
  <line x1="6"   y1="67" x2="254" y2="67" stroke="#e879f9" stroke-width="1.5" opacity="0.4"/>
  <line x1="6"   y1="96" x2="254" y2="96" stroke="#e879f9" stroke-width="1.5" opacity="0.4"/>
  <line x1="65"  y1="6"  x2="65"  y2="124" stroke="#e879f9" stroke-width="1.5" opacity="0.4"/>
  <line x1="131" y1="6"  x2="131" y2="124" stroke="#e879f9" stroke-width="1.5" opacity="0.4"/>
  <line x1="195" y1="6"  x2="195" y2="124" stroke="#e879f9" stroke-width="1.5" opacity="0.4"/>
</g>
<text x="150" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#e879f9" letter-spacing="0.5">Gymnastics Mat</text>
<text x="150" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#e879f9" letter-spacing="0.5">4x8ft</text>
<text x="150" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ffffff" opacity="0.6">GameON</text>
</svg>