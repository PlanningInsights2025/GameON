<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000066"/></filter>
  </defs>
  <!-- background -->
  <rect width="300" height="300" fill="url(#bg)"/>
  <rect width="300" height="300" fill="url(#shine)"/>
  <!-- subtle grid -->
  <line x1="0" y1="150" x2="300" y2="150" stroke="#60a5fa" stroke-width="0.4" opacity="0.2"/>
  <line x1="150" y1="0" x2="150" y2="300" stroke="#60a5fa" stroke-width="0.4" opacity="0.2"/>
  
<g transform="translate(40,60)" filter="url(#shadow)">
  <path d="M10,130 Q15,70 90,55 Q160,45 195,75 L205,130 Z" fill="#60a5fa"/>
  <path d="M10,130 Q50,150 110,150 Q170,150 205,130" fill="#2563eb"/>
  <!-- sole  -->
  <rect x="10" y="128" width="195" height="14" rx="4" fill="#ffffff" opacity="0.4"/>
  <!-- cleat -->
  <rect x="85" y="138" width="45" height="18" rx="4" fill="#ffffff"/>
  <rect x="92" y="141" width="10" height="12" rx="2" fill="#60a5fa"/>
  <rect x="108" y="141" width="10" height="12" rx="2" fill="#60a5fa"/>
  <!-- boa dial -->
  <circle cx="155" cy="95" r="16" fill="#2563eb"/>
  <circle cx="155" cy="95" r="10" fill="#60a5fa"/>
</g>
<text x="150" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#60a5fa" letter-spacing="0.5">Cycling Shoes</text>
<text x="150" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#60a5fa" letter-spacing="0.5">Clipless</text>
<text x="150" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ffffff" opacity="0.6">GameON</text>
</svg>