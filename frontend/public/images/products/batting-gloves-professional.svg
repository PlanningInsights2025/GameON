<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a5c"/>
      <stop offset="100%" style="stop-color:#2d5986"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000066"/></filter>
  </defs>
  <!-- background -->
  <rect width="300" height="300" fill="url(#bg)"/>
  <rect width="300" height="300" fill="url(#shine)"/>
  <!-- subtle grid -->
  <line x1="0" y1="150" x2="300" y2="150" stroke="#e8c84a" stroke-width="0.4" opacity="0.2"/>
  <line x1="150" y1="0" x2="150" y2="300" stroke="#e8c84a" stroke-width="0.4" opacity="0.2"/>
  
<g transform="translate(95,60)" filter="url(#shadow)">
  <rect x="20" y="50" width="70" height="80" rx="15" fill="#e8c84a"/>
  <rect x="20" y="50" width="70" height="25" rx="10" fill="#ffffff" opacity="0.3"/>
  <rect x="10" y="90" width="20" height="55" rx="8" fill="#e8c84a" opacity="0.9"/>
  <rect x="80" y="90" width="20" height="50" rx="8" fill="#e8c84a" opacity="0.9"/>
  <rect x="25" y="30" width="18" height="30" rx="7" fill="#e8c84a"/>
  <rect x="47" y="20" width="18" height="40" rx="7" fill="#e8c84a"/>
  <rect x="69" y="25" width="18" height="35" rx="7" fill="#e8c84a"/>
  <line x1="40" y1="70" x2="80" y2="70" stroke="#2d5986" stroke-width="2" opacity="0.5"/>
</g>
<text x="150" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#e8c84a" letter-spacing="0.5">Batting Gloves</text>
<text x="150" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#e8c84a" letter-spacing="0.5">Professional</text>
<text x="150" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ffffff" opacity="0.6">GameON</text>
</svg>