<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#451a03"/>
      <stop offset="100%" style="stop-color:#92400e"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000066"/></filter>
  </defs>
  <!-- background -->
  <rect width="300" height="300" fill="url(#bg)"/>
  <rect width="300" height="300" fill="url(#shine)"/>
  <!-- subtle grid -->
  <line x1="0" y1="150" x2="300" y2="150" stroke="#fcd34d" stroke-width="0.4" opacity="0.2"/>
  <line x1="150" y1="0" x2="150" y2="300" stroke="#fcd34d" stroke-width="0.4" opacity="0.2"/>
  
<g transform="translate(60,30)" filter="url(#shadow)">
  <!-- bow curve -->
  <path d="M30,10 C-10,80 -10,160 30,230" fill="none" stroke="#fcd34d" stroke-width="12" stroke-linecap="round"/>
  <!-- string -->
  <line x1="30" y1="10" x2="30" y2="230" stroke="#ffffff" stroke-width="2"/>
  <!-- arrow -->
  <line x1="30" y1="120" x2="165" y2="120" stroke="#fcd34d" stroke-width="5" stroke-linecap="round"/>
  <polygon points="165,120 150,113 150,127" fill="#fcd34d"/>
  <!-- arrow fletching -->
  <polygon points="35,120 30,113 42,115" fill="#fcd34d" opacity="0.7"/>
  <polygon points="35,120 30,127 42,125" fill="#fcd34d" opacity="0.7"/>
  <!-- grip -->
  <rect x="20" y="105" width="20" height="30" rx="5" fill="#92400e"/>
</g>
<text x="150" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#fcd34d" letter-spacing="0.5">Recurve Bow 70"</text>
<text x="150" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ffffff" opacity="0.6">GameON</text>
</svg>