<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b21a8"/>
      <stop offset="100%" style="stop-color:#9333ea"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000066"/></filter>
  </defs>
  <!-- background -->
  <rect width="300" height="300" fill="url(#bg)"/>
  <rect width="300" height="300" fill="url(#shine)"/>
  <!-- subtle grid -->
  <line x1="0" y1="150" x2="300" y2="150" stroke="#e879f9" stroke-width="0.4" opacity="0.2"/>
  <line x1="150" y1="0" x2="150" y2="300" stroke="#e879f9" stroke-width="0.4" opacity="0.2"/>
  
<g transform="translate(30,90)" filter="url(#shadow)">
  <!-- beam -->
  <rect x="0" y="55" width="240" height="18" rx="6" fill="#e879f9"/>
  <!-- legs -->
  <rect x="25"  y="73" width="18" height="60" rx="4" fill="#9333ea"/>
  <rect x="197" y="73" width="18" height="60" rx="4" fill="#9333ea"/>
  <!-- feet -->
  <rect x="15"  y="130" width="38" height="10" rx="4" fill="#9333ea"/>
  <rect x="187" y="130" width="38" height="10" rx="4" fill="#9333ea"/>
  <!-- figure -->
  <circle cx="120" cy="30" r="14" fill="#ffffff"/>
  <line x1="120" y1="44" x2="120" y2="55" stroke="#ffffff" stroke-width="4"/>
  <line x1="90"  y1="52" x2="150" y2="40" stroke="#ffffff" stroke-width="4"/>
  <line x1="108" y1="55" x2="100" y2="78" stroke="#ffffff" stroke-width="4"/>
  <line x1="132" y1="55" x2="140" y2="78" stroke="#ffffff" stroke-width="4"/>
</g>
<text x="150" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#e879f9" letter-spacing="0.5">Professional</text>
<text x="150" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#e879f9" letter-spacing="0.5">Balance Beam</text>
<text x="150" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ffffff" opacity="0.6">GameON</text>
</svg>