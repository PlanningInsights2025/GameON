<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4c1d95"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000066"/></filter>
  </defs>
  <!-- background -->
  <rect width="300" height="300" fill="url(#bg)"/>
  <rect width="300" height="300" fill="url(#shine)"/>
  <!-- subtle grid -->
  <line x1="0" y1="150" x2="300" y2="150" stroke="#c4b5fd" stroke-width="0.4" opacity="0.2"/>
  <line x1="150" y1="0" x2="150" y2="300" stroke="#c4b5fd" stroke-width="0.4" opacity="0.2"/>
  
<g filter="url(#shadow)">
  <circle cx="75"  cy="100" r="35" fill="#f87171"/>
  <circle cx="150" cy="100" r="35" fill="#f87171"/>
  <circle cx="225" cy="100" r="35" fill="#f87171"/>
  <circle cx="75"  cy="175" r="35" fill="#f87171"/>
  <circle cx="150" cy="175" r="35" fill="#f87171"/>
  <circle cx="225" cy="175" r="35" fill="#f87171"/>
  <line x1="75" y1="65" x2="75" y2="135" stroke="#1a1a1a" stroke-width="2" opacity="0.3"/>
  <line x1="40" y1="100" x2="110" y2="100" stroke="#1a1a1a" stroke-width="2" opacity="0.3"/>
</g>
<text x="150" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#c4b5fd" letter-spacing="0.5">Table Tennis Balls</text>
<text x="150" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#c4b5fd" letter-spacing="0.5">3-Star</text>
<text x="150" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ffffff" opacity="0.6">GameON</text>
</svg>