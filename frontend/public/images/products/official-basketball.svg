<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b45309"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000066"/></filter>
  </defs>
  <!-- background -->
  <rect width="300" height="300" fill="url(#bg)"/>
  <rect width="300" height="300" fill="url(#shine)"/>
  <!-- subtle grid -->
  <line x1="0" y1="150" x2="300" y2="150" stroke="#fbbf24" stroke-width="0.4" opacity="0.2"/>
  <line x1="150" y1="0" x2="150" y2="300" stroke="#fbbf24" stroke-width="0.4" opacity="0.2"/>
  
<g transform="translate(150,145)" filter="url(#shadow)">
  <circle cx="0" cy="0" r="60" fill="#e85d04"/>
  <path d="M-60,0 Q-30,-55 0,-60 Q30,-55 60,0" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <path d="M-60,0 Q-30,55 0,60 Q30,55 60,0"  fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="-60" y1="0" x2="60" y2="0"   stroke="#1a1a1a" stroke-width="3"/>
  <line x1="0" y1="-60" x2="0" y2="60"   stroke="#1a1a1a" stroke-width="3"/>
</g>
<text x="150" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#fbbf24" letter-spacing="0.5">Official</text>
<text x="150" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#fbbf24" letter-spacing="0.5">Basketball</text>
<text x="150" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ffffff" opacity="0.6">GameON</text>
</svg>