<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000066"/></filter>
  </defs>
  <!-- background -->
  <rect width="300" height="300" fill="url(#bg)"/>
  <rect width="300" height="300" fill="url(#shine)"/>
  <!-- subtle grid -->
  <line x1="0" y1="150" x2="300" y2="150" stroke="#60a5fa" stroke-width="0.4" opacity="0.2"/>
  <line x1="150" y1="0" x2="150" y2="300" stroke="#60a5fa" stroke-width="0.4" opacity="0.2"/>
  
<g transform="translate(30,60)" filter="url(#shadow)">
  <!-- wheels -->
  <circle cx="55"  cy="170" r="52" fill="none" stroke="#60a5fa" stroke-width="10"/>
  <circle cx="185" cy="170" r="52" fill="none" stroke="#60a5fa" stroke-width="10"/>
  <circle cx="55"  cy="170" r="8" fill="#60a5fa"/>
  <circle cx="185" cy="170" r="8" fill="#60a5fa"/>
  <!-- spokes -->
  <line x1="55"  y1="118" x2="55"  y2="222" stroke="#60a5fa" stroke-width="2" opacity="0.5"/>
  <line x1="3"   y1="170" x2="107" y2="170" stroke="#60a5fa" stroke-width="2" opacity="0.5"/>
  <line x1="18"  y1="133" x2="92"  y2="207" stroke="#60a5fa" stroke-width="2" opacity="0.5"/>
  <line x1="18"  y1="207" x2="92"  y2="133" stroke="#60a5fa" stroke-width="2" opacity="0.5"/>
  <line x1="185" y1="118" x2="185" y2="222" stroke="#60a5fa" stroke-width="2" opacity="0.5"/>
  <line x1="133" y1="170" x2="237" y2="170" stroke="#60a5fa" stroke-width="2" opacity="0.5"/>
  <line x1="148" y1="133" x2="222" y2="207" stroke="#60a5fa" stroke-width="2" opacity="0.5"/>
  <line x1="148" y1="207" x2="222" y2="133" stroke="#60a5fa" stroke-width="2" opacity="0.5"/>
  <!-- frame -->
  <line x1="55"  y1="170" x2="120" y2="90"  stroke="#60a5fa" stroke-width="7" stroke-linecap="round"/>
  <line x1="120" y1="90"  x2="185" y2="170" stroke="#60a5fa" stroke-width="7" stroke-linecap="round"/>
  <line x1="120" y1="90"  x2="120" y2="50"  stroke="#60a5fa" stroke-width="7" stroke-linecap="round"/>
  <line x1="55"  y1="120" x2="120" y2="90"  stroke="#60a5fa" stroke-width="7" stroke-linecap="round"/>
  <!-- saddle / handle -->
  <rect x="105" y="43" width="30" height="8" rx="4" fill="#ffffff"/>
  <rect x="108" y="35" width="6"  height="15" rx="2" fill="#60a5fa"/>
</g>
<text x="150" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#60a5fa" letter-spacing="0.5">Road Bike Carbon</text>
<text x="150" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#60a5fa" letter-spacing="0.5">Frame</text>
<text x="150" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ffffff" opacity="0.6">GameON</text>
</svg>